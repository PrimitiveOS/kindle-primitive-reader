<?xml version="1.0" encoding="utf-8"?>

<head>
<title>Reading style specimen</title>
<style>
body { margin: 0; padding: 0; background-color: #dddddd; }
p { margin: 0 0 12px; padding: 12px 18px; text-indent: 0; text-align: left; color: #707070; }

#tinted { background-color: #e0e0e0; }
</style>
</head>
<body>
<p id="slate">Slate border specimen.</p>
<p id="tinted">Tinted paper specimen.</p>
</body>
