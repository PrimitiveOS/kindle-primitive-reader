<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"><head><title>Inline boxes specimen</title>
<style type="text/css">
body, p { margin:0; padding:0; text-indent:0; text-align:left; }
p { margin-bottom:20px; }
.box { display:inline-block; background-color:#ccc; }
.fixed { width:192px; padding:6px 12px; margin-left:8px; background-color:#d2d2d2; }
.narrow { width:104px; padding:4px 8px; }
.fraction { width:40%; box-sizing:border-box; padding:4px 10px; background-color:#dedede; }
</style></head><body>
<p><span id="trail">Trail</span> <span class="box fixed"><a href="#arrival" id="cafe">Café</a></span> <span id="opens">opens</span> here.</p>
<p><span id="sea">Sea</span> <span class="box"><em id="glass">glass</em> edge</span> <span id="shines">shines</span> here.</p>
<p><span id="wind">Wind</span> <span class="box narrow" id="inside">River bend</span> <span id="rests">rests</span> here.</p>
<p><span id="lantern">Lantern</span> <span class="box fraction" id="shelter">Shelter</span> <span id="lights">lights</span> here.</p>
<p><span id="bank">Across the long widening bank of the bright</span> <span class="box fixed" id="distant">Distant</span> <span id="water">water</span>.</p>
<p><span class="box" id="arrival">Arrival</span></p>
</body></html>
