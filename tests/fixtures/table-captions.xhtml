<?xml version="1.0" encoding="utf-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<title>Table captions</title>
<style>
body, p { margin: 0; padding: 0; text-indent: 0; }
table { width: 60%; margin-top: 8px; margin-bottom: 8px; padding: 5px 11px; border: 3px solid #000; border-spacing: 4px; background: #f6f6f6; }
caption { padding: 4px 5px; background: #ddd; text-align: left; border: 1px solid #666; }
td { padding: 2px 3px; text-align: left; }
.author { caption-side: bottom; }
.collapsed { border-collapse: collapse; }
</style>
</head>
<body>
<p>Quay log.</p>
<table>
<tbody><tr><td>North berth</td><td>Clear</td></tr><tr><td>North tide</td><td>Rising</td></tr></tbody>
<caption id="late"><a href="#finish">Late caption</a></caption>
</table>
<table>
<caption id="hint" align="BoTtOm">Attribute caption</caption>
<tbody><tr><td>East berth</td><td>Open</td></tr><tr><td>East tide</td><td>Steady</td></tr></tbody>
</table>
<table class="author">
<caption id="author"><p>Author caption</p></caption>
<tbody><tr><td>South berth</td><td>Open</td></tr><tr><td>South tide</td><td>Falling</td></tr></tbody>
</table>
<table class="collapsed">
<caption id="override" align="bottom" style="caption-side:top">Override caption</caption>
<tbody><tr><td>West berth</td><td>Busy</td></tr><tr><td>West tide</td><td>Rising</td></tr></tbody>
</table>
<p id="finish">End of quay log.</p>
</body>
</html>
