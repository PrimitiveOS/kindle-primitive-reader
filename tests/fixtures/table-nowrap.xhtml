<?xml version="1.0" encoding="utf-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>Harbor watch</title>
  <style type="text/css">
    table {font-size:100%;border-collapse:collapse;margin:0.45em 0}
    table.narrow {width:380px}
    table.tiny {width:210px}
    .description {width:40%}
    td, th {text-align:left;font-weight:normal;border:1px solid black;padding:0 4px}
  </style>
</head>
<body>
  <h1>Harbor watch</h1>
  <table class="narrow"><tr>
    <td class="description" nowrap="false"><span id="harbor">Harbor</span> <em>lantern</em> <span id="beam">beam</span></td>
    <td>Port</td>
  </tr></table>
  <table class="narrow"><tr>
    <th class="description" style="white-space:nowrap"><span id="early">Early</span> <em>morning</em> <span id="ferry">ferry</span></th>
    <td>East</td>
  </tr></table>
  <table class="narrow"><tr>
    <th class="description" nowrap="" style="white-space:normal"><span id="west">West</span> <em>channel</em> <span id="signal">signal</span></th>
    <td>Dock</td>
  </tr></table>
  <table><tr>
    <td nowrap="nowrap"><span id="first">First watch</span><br/><span id="second">Second shift</span></td>
    <td>Pier</td>
  </tr></table>
  <table><tr>
    <td nowrap="nowrap"><span id="storm">Storm</span> reports show heavy rain and rough water past the lighthouse through the evening <span id="watch">watch</span>.</td>
    <td>Wind</td>
  </tr></table>
  <table class="tiny"><tr>
    <td nowrap="nowrap"><span id="south">South</span> jetty <span id="searchlight">searchlight</span></td>
    <td>Bay</td>
  </tr></table>
</body>
</html>
