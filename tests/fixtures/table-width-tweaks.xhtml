<?xml version="1.0" encoding="utf-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>Harbor instruments</title>
  <style type="text/css">
    table {border-collapse:collapse;margin-top:1em;margin-bottom:1em}
    th, td {border:1px solid black;padding:0 4px;text-align:left}
    td.end {text-align:right}
    .published {width:74%}
    .wide {width:68%}
    col.fixed {width:172px}
    .extra {width:240px}
  </style>
</head>
<body>
  <h1>Harbor instruments</h1>
  <p id="map">Pier map</p>
  <table>
    <tr><td id="beacon">Beacon</td><td id="north" class="end">North</td></tr>
    <tr><td id="tide" colspan="2">Low tide</td></tr>
  </table>
  <table class="published">
    <tr><td id="bell" class="wide">Bell</td><td id="east" class="end">East</td></tr>
    <tr><td id="horn" class="wide">Horn</td><td id="south">South</td></tr>
  </table>
  <table>
    <colgroup><col style="width:64%"/><col style="width:36%"/></colgroup>
    <tr><td id="ferry" rowspan="2">Ferry</td><td id="west" class="end">West</td></tr>
    <tr><td id="wharf">Wharf</td></tr>
  </table>
  <table>
    <colgroup><col class="fixed"/><col width="108"/></colgroup>
    <tr><td id="cedar" class="extra">Cedar</td><td id="birch" class="end">Birch</td></tr>
    <tr><td id="willow">Willow</td><td id="alder">Alder</td></tr>
  </table>
</body>
</html>
