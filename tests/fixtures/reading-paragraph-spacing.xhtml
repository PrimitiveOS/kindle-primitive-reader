<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head><title>Paragraph spacing</title></head>
<body>
<p id="first">Morning rain.</p>
<p id="second">Water fills the bowl.</p>
<p id="third">Mist softens the harbor.</p>
<h2 id="heading">Afternoon</h2>
<p id="after-heading">A late ferry returns.</p>
<p id="authored" style="text-indent:2em;margin-top:2em">A bright signal.</p>
</body>
</html>
