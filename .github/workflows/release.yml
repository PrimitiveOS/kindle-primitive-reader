name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: PrimitiveOS/kindle-primitive-build/.github/workflows/package.yml@6235c4d7327fbcfce74fc68ec06ae3c4f9c4665d
    permissions:
      contents: write
    with:
      id: primitive-reader
      dir: reader
      binary-crate: reader-kindle
      arches: armhf
      firmware-min: "5.16.3"
      docs-licence-file: LICENSE-DOCS
