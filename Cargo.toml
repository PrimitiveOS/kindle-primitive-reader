[package]
name = "reader"
version = "0.1.50"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
description = "Offline book reader for PrimitiveOS on Kindle"

[features]
# On by default: the release (the shared package workflow) builds the Kindle binary without naming a feature.
default = ["kindle"]
# Independent reference build for pixel comparisons against full JPEG decoding.
reference-full-dct = ["hayro-interpret/reference-full-dct"]
kindle = ["dep:primitive-app", "dep:primitive-ui", "dep:unicode-bidi", "dep:ureq", "dep:url", "dep:qrcodegen", "dep:self_cell", "dep:primitive-device", "dep:rusqlite"]

[build-dependencies]
cc = "=1.11.2"

[dependencies]
kurbo = "=0.13.1"
ab_glyph_rasterizer = "=0.1.10"
anyrender_vello_cpu = "=0.18.0"
base64 = "=0.23.1"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }
blitz-html = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = "=0.3.0-beta.4"
cssparser = "=0.38.0"
djvu-rs = { version = "=0.46.0", default-features = false, features = ["std"] }
encoding_rs = "=0.8.44"
flate2 = "=1.1.11"
gif = { version = "=0.14.2", default-features = false, features = ["std", "raii_no_panic"] }
harfrust = "=0.12.0"
hayro = "=0.9.0"
hayro-interpret = { version = "=0.9.0", default-features = false }
hayro-jpeg2000 = { version = "=0.5.0", default-features = false, features = ["std"] }
html5ever = "=0.40.1"
icu_casemap = "=2.4.0"
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
icu_properties = "=2.4.0"
icu_segmenter = "=2.4.0"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "jpeg", "png", "pnm", "webp"] }
libc = "=0.2.191"
libchm = { path = "vendor/libchm", version = "=0.3.0" }
lopdf = { version = "=0.47.0", default-features = false }
md5 = "=0.8.0"
parley = { version = "=0.12.0", default-features = false, features = ["std", "complex-scripts"] }
percent-encoding = "=2.3.2"
png = "=0.17.16"
primitive-device = { git = "https://github.com/PrimitiveOS/kindle-primtitive-tools.git", rev = "86e593eb865b56615108406d8a7bf7bd20a38c6d", optional = true }
primitive-app = { git = "https://github.com/PrimitiveOS/kindle-primtitive-tools.git", rev = "86e593eb865b56615108406d8a7bf7bd20a38c6d", optional = true }
primitive-ui = { git = "https://github.com/PrimitiveOS/kindle-primtitive-tools.git", rev = "86e593eb865b56615108406d8a7bf7bd20a38c6d", optional = true }
pulldown-cmark = { version = "=0.13.0", default-features = false, features = ["html"] }
rars = { version = "=0.12.3", default-features = false }
resvg = { version = "=0.50.0", default-features = false, features = ["raster-images"] }
roxmltree = "=0.21.2"
rusqlite = { version = "=0.37.0", features = ["bundled", "hooks", "serialize"], optional = true }
self_cell = { version = "=1.3.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"], optional = true }
url = { version = "=2.5.8", optional = true }
unicode-bidi = { version = "=0.3.18", optional = true }
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }
qrcodegen = { version = "=1.8.0", optional = true }
ring = { version = "=0.17.14", default-features = false }

[target.'cfg(target_arch = "arm")'.dependencies]
# Select the exact-color cache for 32-bit ARM's scalar CMYK conversion.
hayro-interpret = { version = "=0.9.0", default-features = false, features = ["cmyk-cache"] }

[[bin]]
name = "reader-kindle"
path = "src/bin/kindle.rs"
required-features = ["kindle"]

[[example]]
name = "desktop"
required-features = ["kindle"]

[patch.crates-io]
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-interpret = { path = "vendor/hayro-interpret" }
djvu-bzz = { path = "vendor/djvu-bzz" }
parley = { path = "vendor/parley" }

[profile.release]
codegen-units = 4

[[example]]
name = "verify_document"
required-features = ["kindle"]

[[example]]
name = "measure_pdf_page"
required-features = ["kindle"]
